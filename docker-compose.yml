version: '3.8'

services:
  bas-mcp-server:
    build: .
    container_name: bas-mcp-server
    # 호스트 네트워크 사용 (Target 스캔 가능)
    network_mode: host
    stdin_open: true
    tty: true
    restart: unless-stopped
    # 로깅
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bas-network:
    driver: bridge
